<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>404 • Not Found</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        /* container */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(1.2rem, 4vw, 1.8rem);
            padding: 2rem;
        }

        /* 404 digits */
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.15em;
            font-size: clamp(5rem, 24vw, 10rem);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.05em;
            color: #16a34a;
            user-select: none;
            -webkit-user-select: none;
        }

        .digit {
            display: inline-block;
            animation: float 2s ease-in-out infinite;
            will-change: transform;
        }

        .digit:nth-child(1) { animation-delay: 0s; }
        .digit:nth-child(2) { animation-delay: 0.2s; }
        .digit:nth-child(3) { animation-delay: 0.4s; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-14px); }
        }

        /* not found text */
        .not-found {
            font-size: clamp(0.85rem, 3.5vw, 1.1rem);
            font-weight: 600;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            color: #16a34a;
            padding-left: 0.5em;
            animation: fade 2s ease-in-out infinite;
            will-change: opacity;
        }

        @keyframes fade {
            0%, 100% { opacity: 0.55; }
            50%      { opacity: 1; }
        }

        /* contact button */
        .contact-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.55rem;
            margin-top: 0.5rem;
            padding: 0.85rem 2rem;
            font-size: clamp(0.85rem, 3vw, 1rem);
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-family: inherit;
            color: #ffffff;
            background: #16a34a;
            border: 2px solid #16a34a;
            border-radius: 100px;
            cursor: pointer;
            transition: all 0.25s ease;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 6px 18px -6px rgba(22, 163, 74, 0.5);
        }

        .contact-btn:hover,
        .contact-btn:focus {
            background: #15803d;
            border-color: #15803d;
            transform: translateY(-2px);
            box-shadow: 0 10px 24px -6px rgba(22, 163, 74, 0.6);
            outline: none;
        }

        .contact-btn:active {
            transform: translateY(0);
            box-shadow: 0 4px 12px -4px rgba(22, 163, 74, 0.5);
        }

        .contact-btn svg {
            width: 1.15em;
            height: 1.15em;
            stroke: currentColor;
            stroke-width: 2.2;
            fill: none;
            flex-shrink: 0;
        }

        /* responsive tweak */
        @media (max-width: 380px) {
            .digit {
                font-size: 4.5rem;
            }
            .not-found {
                letter-spacing: 0.35em;
                font-size: 0.75rem;
            }
            .contact-btn {
                padding: 0.75rem 1.6rem;
                font-size: 0.8rem;
            }
        }

        /* respect reduced motion */
        @media (prefers-reduced-motion: reduce) {
            .digit,
            .not-found {
                animation: none;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 404 logo -->
        <div class="logo">
            <span class="digit">4</span>
            <span class="digit">0</span>
            <span class="digit">4</span>
        </div>

        <!-- not found -->
        <div class="not-found">not found</div>

        <!-- contact button (no URL shown) -->
        <button class="contact-btn" onclick="window.open('https://shofiqul5.github.io', '_blank', 'noopener,noreferrer')">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
            </svg>
            <span>Contact</span>
        </button>
    </div>

</body>
</html>
