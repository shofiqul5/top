<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Encryption</title>
    <style>
        :root {
            --bg: #eef1f6;
            --panel: #ffffff;
            --text: #1b2333;
            --muted: #8a94a8;
            --border: #d5dbe7;
            --field: #f6f8fc;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --accent-soft: #ecebff;
            --danger: #c62828;
            --danger-soft: #fdecec;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0d111b;
                --panel: #161c2a;
                --text: #e7eaf2;
                --muted: #7d889e;
                --border: #2a3448;
                --field: #101523;
                --accent: #7c75f5;
                --accent-hover: #978ff8;
                --accent-soft: #232046;
                --danger: #ff7b7b;
                --danger-soft: #3a1d22;
            }
        }

        * { box-sizing: border-box; }
        [hidden] { display: none !important; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Bengali", Arial, sans-serif;
            line-height: 1.5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        .app { width: 100%; max-width: 920px; }

        .bar { margin-bottom: 14px; }
        .seg {
            display: inline-flex;
            gap: 2px;
            padding: 3px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
        }
        .seg button {
            padding: 8px 18px;
            border: 0;
            border-radius: 7px;
            background: transparent;
            color: var(--muted);
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }
        .seg button:hover { color: var(--text); }
        .seg button[aria-selected="true"] {
            background: var(--accent);
            color: #fff;
        }

        .panes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .pane {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 360px;
            padding: 16px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
        }

        input[type="password"], input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--field);
            color: var(--text);
            font: inherit;
            font-size: 15px;
        }
        ::placeholder { color: var(--muted); opacity: 1; }

        :is(button, input, textarea, a):focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 2px;
        }

        .keyrow { display: flex; gap: 8px; }
        .keyrow input { flex: 1; min-width: 0; }
        .icon-btn {
            flex: none;
            width: 46px;
            display: grid;
            place-items: center;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--field);
            color: var(--muted);
            cursor: pointer;
        }
        .icon-btn:hover { color: var(--accent); border-color: var(--accent); }
        .icon-btn .slash {
            stroke-dasharray: 26;
            stroke-dashoffset: 26;
            transition: stroke-dashoffset 0.25s ease;
        }
        .icon-btn .pupil {
            transform-origin: 12px 12px;
            transition: transform 0.25s ease;
        }
        .icon-btn.on { color: var(--accent); }
        .icon-btn.on .slash { stroke-dashoffset: 0; }
        .icon-btn.on .pupil { transform: scale(0.55); }

        .primary {
            display: block;
            width: 100%;
            padding: 13px 16px;
            border: 0;
            border-radius: 10px;
            background: var(--accent);
            color: #fff;
            font: inherit;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }
        .primary:hover:not(:disabled) { background: var(--accent-hover); }
        .primary:disabled { opacity: 0.65; cursor: progress; }

        .out-pane { justify-content: center; }
        .empty { flex: 1; display: grid; place-items: center; color: var(--border); }
        .error {
            padding: 12px 14px;
            border-radius: 10px;
            background: var(--danger-soft);
            color: var(--danger);
            font-size: 14px;
            font-weight: 600;
        }

        @media (max-width: 720px) {
            .panes { grid-template-columns: 1fr; }
            .pane { min-height: 0; }
            .seg { display: flex; }
            .seg button { flex: 1; }
        }
        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }

        textarea {
            width: 100%;
            flex: 1;
            min-height: 160px;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--field);
            color: var(--text);
            font: inherit;
            font-size: 15px;
            resize: none;
        }
        .secondary {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--field);
            color: var(--text);
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }
        .secondary:hover { border-color: var(--accent); color: var(--accent); }
        #resultText { flex: 1; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
        .out {
            flex: 1;
            margin: 0;
            padding: 12px 14px;
            overflow: auto;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--field);
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans Bengali", monospace;
            font-size: 13px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
    </style>
</head>
<body>

<main class="app">
    <nav class="bar">
        <div class="seg" role="tablist" aria-label="Action">
            <button type="button" role="tab" id="modeEncrypt" aria-selected="true">Encrypt</button>
            <button type="button" role="tab" id="modeDecrypt" aria-selected="false">Decrypt</button>
        </div>
    </nav>

    <div class="panes">
        <!-- Input -->
        <section class="pane">
            <textarea id="textInput" spellcheck="false" aria-label="Input"></textarea>
            <div class="keyrow">
                <input type="password" id="keyInput" placeholder="Key" aria-label="Key" autocomplete="off" spellcheck="false">
                <button type="button" class="icon-btn" id="toggleKey" aria-label="Show key" aria-pressed="false">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle class="pupil" cx="12" cy="12" r="3"></circle>
                        <path class="slash" d="M3 3l18 18"></path>
                    </svg>
                </button>
            </div>
            <button type="button" class="primary" id="actionBtn">Encrypt</button>
        </section>

        <!-- Output -->
        <section class="pane out-pane" aria-live="polite">
            <div class="empty" id="empty" aria-hidden="true">
                <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="11" width="16" height="10" rx="2"></rect>
                    <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
                </svg>
            </div>
            <div id="resultText" hidden>
                <pre class="out" id="resultOut"></pre>
                <button type="button" class="secondary" id="copyBtn">Copy</button>
            </div>
            <div class="error" id="resultError" role="alert" hidden></div>
        </section>
    </div>
</main>

<script>
    /* AES-256-GCM, key derived with PBKDF2-SHA256. Random salt and IV on every encryption;
       GCM rejects wrong keys and altered data.
       Packed layout: [1 byte version = 1][16 salt][12 IV][ciphertext + 16-byte tag], Base64-encoded. */
    const VERSION_TEXT = 1;

    const SALT_LEN = 16;
    const IV_LEN = 12;
    const TAG_LEN = 16;
    const HEADER_LEN = 1 + SALT_LEN + IV_LEN;
    const PBKDF2_ITERATIONS = 200000;

    const textEnc = new TextEncoder();
    const textDec = new TextDecoder('utf-8', { fatal: true });

    class CryptoError extends Error {
        constructor(kind) { super(kind); this.kind = kind; }
    }

    async function deriveAesKey(passphrase, salt) {
        const base = await crypto.subtle.importKey(
            'raw', textEnc.encode(passphrase.normalize('NFC')), 'PBKDF2', false, ['deriveKey']
        );
        return crypto.subtle.deriveKey(
            { name: 'PBKDF2', salt: salt, iterations: PBKDF2_ITERATIONS, hash: 'SHA-256' },
            base,
            { name: 'AES-GCM', length: 256 },
            false,
            ['encrypt', 'decrypt']
        );
    }

    async function seal(version, plainBytes, passphrase) {
        const salt = crypto.getRandomValues(new Uint8Array(SALT_LEN));
        const iv = crypto.getRandomValues(new Uint8Array(IV_LEN));
        const key = await deriveAesKey(passphrase, salt);
        const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, plainBytes));
        const packed = new Uint8Array(HEADER_LEN + ct.length);
        packed[0] = version;
        packed.set(salt, 1);
        packed.set(iv, 1 + SALT_LEN);
        packed.set(ct, HEADER_LEN);
        return packed;
    }

    async function open(version, packed, passphrase) {
        if (packed.length < HEADER_LEN + TAG_LEN || packed[0] !== version) throw new CryptoError('format');
        const salt = packed.slice(1, 1 + SALT_LEN);
        const iv = packed.slice(1 + SALT_LEN, HEADER_LEN);
        const ct = packed.subarray(HEADER_LEN);
        const key = await deriveAesKey(passphrase, salt);
        try {
            return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct));
        } catch (e) {
            throw new CryptoError('auth');
        }
    }

    function bytesToB64(bytes) {
        let bin = '';
        for (let i = 0; i < bytes.length; i += 0x8000) {
            bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
        }
        return btoa(bin);
    }

    function b64ToBytes(str) {
        const bin = atob(str);
        const out = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
        return out;
    }

    async function encryptText(message, passphrase) {
        return bytesToB64(await seal(VERSION_TEXT, textEnc.encode(message), passphrase));
    }

    async function decryptText(payload, passphrase) {
        let packed;
        try { packed = b64ToBytes(payload.replace(/\s+/g, '')); }
        catch (e) { throw new CryptoError('format'); }
        return textDec.decode(await open(VERSION_TEXT, packed, passphrase));
    }

    /* ====================== UI ====================== */
    const $ = (id) => document.getElementById(id);
    let mode = 'encrypt';   // 'encrypt' | 'decrypt'

    function render() {
        const enc = mode === 'encrypt';
        $('modeEncrypt').setAttribute('aria-selected', enc);
        $('modeDecrypt').setAttribute('aria-selected', !enc);
        $('textInput').placeholder = enc ? 'Message' : 'Encrypted text';
        $('actionBtn').textContent = enc ? 'Encrypt' : 'Decrypt';
    }

    function clearResult() {
        $('empty').hidden = false;
        $('resultText').hidden = true;
        $('resultError').hidden = true;
    }

    function showError(message) {
        clearResult();
        $('empty').hidden = true;
        $('resultError').textContent = message;
        $('resultError').hidden = false;
    }

    function showResult(text) {
        clearResult();
        $('empty').hidden = true;
        $('resultOut').textContent = text;
        $('copyBtn').textContent = 'Copy';
        $('resultText').hidden = false;
    }

    function errorMessage(e) {
        switch (e && e.kind) {
            case 'auth': return 'Wrong key or corrupted data.';
            case 'format': return 'Not valid encrypted data.';
            default: return 'Something went wrong.';
        }
    }

    async function run() {
        const text = $('textInput').value;
        const pass = $('keyInput').value;
        if (!text.trim()) { showError('Enter text.'); return; }
        if (!pass) { showError('Enter a key.'); return; }

        const btn = $('actionBtn');
        const idleLabel = btn.textContent;
        btn.disabled = true;
        btn.textContent = '…';
        try {
            showResult(mode === 'encrypt' ? await encryptText(text, pass) : await decryptText(text, pass));
        } catch (e) {
            showError(errorMessage(e));
        } finally {
            btn.disabled = false;
            btn.textContent = idleLabel;
        }
    }

    /* ====================== Events ====================== */
    $('modeEncrypt').addEventListener('click', () => { mode = 'encrypt'; clearResult(); render(); });
    $('modeDecrypt').addEventListener('click', () => { mode = 'decrypt'; clearResult(); render(); });
    $('actionBtn').addEventListener('click', run);
    $('keyInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') run(); });

    $('toggleKey').addEventListener('click', () => {
        const input = $('keyInput');
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        $('toggleKey').classList.toggle('on', show);
        $('toggleKey').setAttribute('aria-pressed', show);
        $('toggleKey').setAttribute('aria-label', show ? 'Hide key' : 'Show key');
    });

    $('copyBtn').addEventListener('click', async () => {
        try {
            await navigator.clipboard.writeText($('resultOut').textContent);
            $('copyBtn').textContent = 'Copied';
        } catch (e) {
            $('copyBtn').textContent = 'Failed';
        }
    });

    render();
</script>

</body>
</html>
